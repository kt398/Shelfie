services:
  postgres:
    image: postgres:16-alpine
    container_name: shelfie-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelfie
      POSTGRES_PASSWORD: shelfie
      POSTGRES_DB: shelfie
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfie -d shelfie"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: shelfie_postgres_data
